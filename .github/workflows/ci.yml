# WP7 CI (build spec section 27): Linux/macOS/Windows × Node 20 and the
# active LTS, running format, lint, strict types, drift checks, schema and
# OpenAPI validation (in the test suite), unit/integration/CLI-contract/MCP
# tests, secret scanning (in the test suite), coverage floors, package
# builds, packaged-artifact clean-install smoke, and no skipped tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Spec package preflight
        run: node docs/raia-devkit-spec/preflight.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Contracts sync check
        run: pnpm contracts:check
      - name: Generated types drift check
        run: pnpm generate:check
      - name: Conversation contract drift check
        run: node packages/conversation-client/scripts/check-contract-sync.mjs
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: No skipped tests
        run: pnpm check:no-skip
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Package artifacts (checksums)
        run: node scripts/package-artifacts.mjs
      - name: Clean-install artifact smoke test
        run: node scripts/package-smoke.mjs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Coverage floors (core 90, providers/eval 85, overall 80)
        run: pnpm coverage

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (assembles plugin dist)
        run: pnpm build
      - name: Strict plugin validation
        run: npx --yes @anthropic-ai/claude-code plugin validate plugins/claude-code --strict
